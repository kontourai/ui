<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kontour UI Gallery</title>
    <link rel="stylesheet" href="../tokens/index.css">
    <link rel="stylesheet" href="../react/styles.css">
    <script type="importmap">
      {
        "imports": {
          "react/jsx-runtime": "../elements/react-jsx-runtime-shim.js"
        }
      }
    </script>
    <script type="module" src="../dist/elements/elements/src/index.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--k-bg);
        color: var(--k-text);
        font-family: var(--k-font-ui);
      }

      main {
        display: grid;
        gap: var(--k-space-5);
        width: min(1180px, calc(100% - var(--k-space-6)));
        margin: 0 auto;
        padding: var(--k-space-6) 0;
      }

      .theme-strip,
      .grid,
      .row,
      .stack {
        display: grid;
        gap: var(--k-space-3);
      }

      .theme-strip {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .row {
        grid-template-columns: repeat(auto-fit, minmax(120px, max-content));
        align-items: center;
      }

      .theme-swatch {
        border: 1px solid var(--k-line);
        border-radius: var(--k-radius-md);
        padding: var(--k-space-4);
        background: var(--k-panel);
      }

      .explorer-card {
        border: 1px solid var(--k-line);
        border-radius: var(--k-radius-md);
        padding: var(--k-space-3);
        background: var(--k-panel);
      }

      .explorer-control-label {
        display: grid;
        gap: var(--k-space-2);
        color: var(--k-text-muted);
        font-size: var(--k-text-sm);
      }

      .theme-swatch strong,
      .label {
        display: block;
        color: var(--k-text-muted);
        font-size: var(--k-text-xs);
        text-transform: uppercase;
        letter-spacing: 0;
      }

      @media (max-width: 820px) {
        main {
          width: min(100% - var(--k-space-4), 1180px);
          padding-block: var(--k-space-4);
        }

        .theme-strip,
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <script type="module">
      import { Badge } from "../dist/react/Badge.js";

      const mount = document.getElementById("react-badge-mount");
      const badge = Badge({ value: "verified" });
      const node = document.createElement(badge.type);
      node.className = badge.props.className;
      node.textContent = badge.props.children;
      mount.replaceChildren(node);

      const explorer = document.getElementById("explorer-entries");
      const manifest = await fetch("./explorer-manifest.json").then((response) => response.json());
      const labeledControl = (control, name) => {
        const label = document.createElement("label");
        label.className = "explorer-control-label";
        label.append(`${name} playground`, control);
        return label;
      };
      const createPlayground = (target, name) => {
        const control = document.createElement(target);
        if (["k-input", "k-select", "k-textarea"].includes(target)) {
          control.setAttribute("placeholder", `Enter ${name.toLowerCase()}`);
          if (target === "k-select") {
            const option = document.createElement("option");
            option.value = "example";
            option.textContent = "Example option";
            control.append(option);
          }
          return labeledControl(control, name);
        }
        if (target === "k-button" || target === "k-checkbox" || target === "k-toggle")
          control.setAttribute("label", `${name} playground`);
        if (target === "k-badge") control.setAttribute("value", name);
        return control;
      };
      for (const entry of [...manifest.exports, ...manifest.elements]) {
        const card = document.createElement("article");
        card.className = "explorer-card";
        card.dataset.explorerId = entry.id;
        card.innerHTML = `<strong>${entry.name}</strong><span class="label">${entry.kind} · ${entry.tokens.join(", ")}</span><p>${entry.specification}</p><p>${entry.accessibility}</p>`;
        const target = entry.playground?.split(":")[1];
        if (target?.startsWith("k-")) card.append(createPlayground(target, entry.name));
        explorer.append(card);
      }
      const matrix = document.getElementById("theme-matrix");
      for (const theme of manifest.themes) for (const mode of ["light", "dark"]) {
        const sample = document.createElement("div");
        sample.className = `theme-swatch ${theme}`;
        sample.dataset.themeMatrix = `${theme}:${mode}`;
        sample.dataset.theme = mode;
        const title = document.createElement("strong");
        title.textContent = `${theme} ${mode}`;
        const button = document.createElement("k-button");
        button.setAttribute("label", "Theme probe");
        button.setAttribute("variant", "primary");
        const input = document.createElement("k-input");
        input.setAttribute("placeholder", "Theme field");
        const toggle = document.createElement("k-toggle");
        toggle.setAttribute("label", "Theme enabled");
        toggle.setAttribute("checked", "");
        sample.append(title, button, labeledControl(input, "Theme field"), toggle);
        matrix.append(sample);
      }
    </script>
  </head>
  <body>
    <main>
      <k-topbar
        eyebrow="Kontour UI"
        title="Primitive Gallery"
        body="One static page proving tokens, React styles, custom elements, and React class contracts render from the same package."
        meta='[{"label":"package","value":"@kontourai/ui"},{"label":"entry","value":"tokens + react + elements"}]'
        actions='[{"label":"Primary","variant":"primary"},{"label":"Ghost","variant":"ghost"}]'
      ></k-topbar>

      <section class="theme-strip" aria-label="Product themes">
        <div class="theme-swatch theme-console"><strong>theme-console</strong><k-badge value="running"></k-badge></div>
        <div class="theme-swatch theme-flow" data-theme="light"><strong>theme-flow light</strong><k-badge value="current"></k-badge></div>
        <div class="theme-swatch theme-survey"><strong>theme-survey</strong><k-badge value="verified"></k-badge></div>
        <div class="theme-swatch theme-surface" data-theme="light"><strong>theme-surface light</strong><k-badge value="published"></k-badge></div>
      </section>
      <section id="theme-matrix" class="theme-strip" aria-label="Theme matrix"></section>

      <section class="grid">
        <k-panel title="Badge parity" count="React beside element">
          <div class="stack">
            <span class="label">React Badge</span>
            <span id="react-badge-mount"></span>
            <span class="label">Custom Elements</span>
            <div class="row">
              <k-badge value="verified"></k-badge>
              <k-badge value="pending"></k-badge>
              <k-badge value="blocked"></k-badge>
              <k-badge value="running"></k-badge>
              <k-badge value="unknown"></k-badge>
            </div>
          </div>
        </k-panel>

        <k-panel title="Status" count="semantic scale">
          <div class="row">
            <k-status-badge status="connected"></k-status-badge>
            <k-status-badge status="waiting"></k-status-badge>
            <k-status-badge status="disconnected"></k-status-badge>
            <k-status-badge status="in review"></k-status-badge>
          </div>
        </k-panel>

        <k-panel title="Actions" count="button variants">
          <div class="row">
            <k-button label="Primary" variant="primary"></k-button>
            <k-button label="Ghost" variant="ghost"></k-button>
            <k-button label="Accept" variant="positive"></k-button>
            <k-button label="Hold" variant="caution"></k-button>
            <k-button label="Reject" variant="negative"></k-button>
          </div>
        </k-panel>

        <k-panel title="Metrics and progress" count="layout primitives">
          <div class="stack">
            <div class="row">
              <k-metric label="Pass rate" value="98%"></k-metric>
              <k-metric label="Open gates" value="3"></k-metric>
            </div>
            <k-progress value="72"></k-progress>
            <div class="row">
              <k-skeleton variant="circle"></k-skeleton>
              <k-skeleton variant="line"></k-skeleton>
            </div>
            <k-skeleton variant="block" height="48px"></k-skeleton>
            <k-empty label="No queued work"></k-empty>
            <k-empty
              label="No connected sources"
              description="Install a plugin to populate the catalog."
            ></k-empty>
            <k-empty
              variant="prominent"
              label="No layouts yet"
              description="Add your first layout to get started."
            ></k-empty>
            <k-empty
              variant="compact"
              label="No tools enabled"
              description="Add tools from the catalog."
            ></k-empty>
          </div>
        </k-panel>
        <k-statusbar
          start="kontourai · main"
          items='[{"value":"3 active"},{"label":"branch","value":"main"}]'
        ></k-statusbar>
        <k-panel title="Form controls" count="inputs and switches">
          <div class="stack">
            <k-input placeholder="Project name"></k-input>
            <k-input placeholder="Invalid value" invalid></k-input>
            <k-select placeholder="Choose a runtime">
              <option value="claude">Claude Code</option>
              <option value="codex">Codex</option>
              <option value="kiro">Kiro</option>
            </k-select>
            <k-textarea placeholder="Notes" rows="2"></k-textarea>
            <div class="row">
              <k-checkbox label="Require evidence" checked></k-checkbox>
              <k-toggle label="Gate on readiness" checked></k-toggle>
            </div>
            <div class="row">
              <k-spinner></k-spinner>
              <span class="label">Working…</span>
            </div>
          </div>
        </k-panel>
      </section>

      <section aria-labelledby="explorer-title">
        <k-panel title="Generated explorer" count="public contract metadata">
          <div class="stack">
            <span id="explorer-title" class="label">Specification, playground, tokens, responsive behavior, accessibility</span>
            <div id="explorer-entries" class="grid"></div>
          </div>
        </k-panel>
      </section>
    </main>
  </body>
</html>
