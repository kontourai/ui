name: Publish NPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Serialize publish runs so a duplicate trigger (the release tag push and a
# workflow_dispatch firing within seconds of each other) cannot race: the second
# run waits for the first to finish, then the "Check Published Version" step sees
# the version already on npm and skips — instead of E403'ing on a double publish.
concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Checkout Kontour UI
        uses: actions/checkout@v6
        with:
          path: ui

      # Reads the exact pnpm version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: ui

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ui

      - name: Verify
        run: npm run verify
        working-directory: ui

  publish:
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Kontour UI
        uses: actions/checkout@v6
        with:
          path: ui

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json

      # Publishing stays on the npm CLI: provenance and the registry binding are
      # properties of the publisher, not the installer, and `npm publish` needs
      # only the built package directory.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: ui

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ui

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          if [ "v${PACKAGE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${PACKAGE_VERSION}" >&2
            exit 1
          fi
        working-directory: ui

      - name: Check published version
        id: published
        run: |
          PACKAGE_NAME=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name")
          PACKAGE_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping npm publish."
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi
        working-directory: ui

      - name: Publish public package
        if: steps.published.outputs.published != 'true'
        run: npm publish --access public --provenance
        working-directory: ui
