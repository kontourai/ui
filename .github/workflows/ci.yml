name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Suite-wide secret-scan gate, one normative source (kontourai/.github).
  secret-scan:
    name: Secret Scan
    uses: kontourai/.github/.github/workflows/secret-scan.yml@main
    permissions:
      contents: read

  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Checkout Kontour UI
        uses: actions/checkout@v6
        with:
          path: ui

      # Reads the exact pnpm version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: ui

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ui

      - name: Verify
        run: npm run verify
        working-directory: ui

  # The publish job's environment, exercised on every pull request.
  #
  # `npm publish` is the one step of the release path that no ordinary check
  # reaches: it runs only on a `v*` tag, and it runs against a tree that pnpm
  # installed, under a `setup-node` that also sets `registry-url` — a
  # combination that appears nowhere else, because the verify jobs omit
  # `registry-url`. After the move to pnpm, nineteen repositories had proven
  # install, build, test and pack, and none had proven publish.
  #
  # This mirrors that environment exactly and stops one step short of the
  # registry write. It cannot publish: `--dry-run` performs no write, the job
  # requests no `id-token` permission so provenance cannot be minted, and no
  # registry credential is provided. Provenance and registry auth are
  # properties of the publisher rather than the installer, so they are
  # deliberately out of scope here; what is in scope is whether `npm publish`
  # can assemble this package from a pnpm-installed tree.
  publish-path:
    name: Publish path (dry run)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Kontour UI
        uses: actions/checkout@v6
        with:
          path: ui

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json

      # registry-url is what makes this job differ from `verify`: it writes an
      # .npmrc, and that .npmrc is what `npm publish` reads. Dropping it here
      # would leave the interaction between pnpm's install and npm's publish
      # configuration untested, which is the whole point of the job.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: ui

      - name: Publish path dry run
        run: |
          set -uo pipefail
          # Deliberately not `set -e`: a non-zero exit here is expected on any
          # ordinary pull request, and the exit code alone is not the signal.
          npm publish --dry-run --access public > /tmp/publish-dry-run.log 2>&1
          STATUS=$?
          cat /tmp/publish-dry-run.log

          # What this job proves: `npm publish` ran this package's prepack
          # build and assembled a tarball from a pnpm-installed tree. An empty
          # or absent file list means it succeeded while assembling nothing.
          if ! grep -q "Tarball Contents" /tmp/publish-dry-run.log; then
            echo "::error::npm publish --dry-run assembled no tarball; the publish path is unproven." >&2
            exit 1
          fi
          FILES="$(grep -E '^npm notice total files:' /tmp/publish-dry-run.log | grep -oE '[0-9]+$' || echo 0)"
          if [ "${FILES}" -lt 1 ]; then
            echo "::error::npm publish --dry-run reported ${FILES} files; expected a non-empty package." >&2
            exit 1
          fi

          # `--dry-run` still asks the registry whether the version exists, so
          # on every pull request between releases it refuses with exactly this
          # message. That refusal is about the version, not the package
          # manager, and is the one failure this job tolerates. Any OTHER
          # non-zero exit is a real publish-path failure and must not be
          # swallowed — which is what makes this a gate rather than a
          # formality.
          if [ "${STATUS}" -ne 0 ]; then
            if grep -q "cannot publish over the previously published versions" /tmp/publish-dry-run.log; then
              echo "Publish path proven from a pnpm-installed tree: ${FILES} files assembled."
              echo "(Registry declined the version as already published, which is expected between releases.)"
              exit 0
            fi
            echo "::error::npm publish --dry-run failed for a reason other than an already-published version." >&2
            exit "${STATUS}"
          fi
          echo "Publish path proven from a pnpm-installed tree: ${FILES} files assembled, version not yet published."
        working-directory: ui
